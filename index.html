<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Drucklayout Tool</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f1115;color:#e7eaf0;font-family:system-ui;height:100vh;overflow:hidden}
.stageWrap{height:100%;display:flex;align-items:center;justify-content:center;background:#0f1115}
#canvasSvg{background:#cfd6df;border-radius:12px}
</style>
</head>
<body>

<div class="stageWrap">
<svg id="canvasSvg" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<script>
/* ================= SVG NORMALIZER ================= */
/* Macht ALLE Fills steuerbar + ergänzt fehlende Fills */

function normalizeSvgToCurrentColor(svgString){
  const parser=new DOMParser();
  const doc=parser.parseFromString(svgString,'image/svg+xml');
  const svg=doc.documentElement;

  // 1. CSS Styles anpassen
  svg.querySelectorAll("style").forEach(style=>{
    style.textContent=style.textContent
      .replace(/fill\s*:\s*(?!none|url\()[^;]+/gi,"fill:currentColor")
      .replace(/stroke\s*:\s*(?!none|url\()[^;]+/gi,"stroke:currentColor");
  });

  const DRAWABLES="path,rect,circle,ellipse,polygon,polyline,line,text,tspan";

  svg.querySelectorAll("*").forEach(el=>{
    const tag=el.tagName.toLowerCase();

    // inline styles
    if(el.hasAttribute("style")){
      el.setAttribute("style",
        el.getAttribute("style")
          .replace(/fill\s*:\s*(?!none|url\()[^;]+/gi,"fill:currentColor")
          .replace(/stroke\s*:\s*(?!none|url\()[^;]+/gi,"stroke:currentColor")
      );
    }

    // vorhandene fill/stroke ersetzen
    if(el.hasAttribute("fill") && el.getAttribute("fill")!=="none"){
      el.setAttribute("fill","currentColor");
    }
    if(el.hasAttribute("stroke") && el.getAttribute("stroke")!=="none"){
      el.setAttribute("stroke","currentColor");
    }

    // ⭐️ NEU: falls drawables KEIN fill haben → hinzufügen
    if(el.matches(DRAWABLES) && !el.hasAttribute("fill") && !el.style.fill){
      el.setAttribute("fill","currentColor");
    }
  });

  return svg.outerHTML;
}

/* ================= TOOL STATE ================= */

const state={
  editableFill:"#000000",
  items:[],
  selection:null
};

/* ================= RENDER ================= */

function render(){
  const svg=document.getElementById("canvasSvg");
  svg.innerHTML="";
  state.items.forEach(it=>{
    const g=document.createElementNS("http://www.w3.org/2000/svg","g");
    g.innerHTML=it.svg;
    g.style.color=it.fill;
    g.addEventListener("click",()=>{
      state.selection=it;
    });
    svg.appendChild(g);
  });
}

/* ================= COLOR PICKER LOGIK ================= */

function setColor(hex){
  state.editableFill=hex;

  // Preview wäre hier global (nicht eingebaut)
  
  // Canvas: nur selektiertes Objekt
  if(state.selection){
    state.selection.fill=hex;
    render();
  }
}

/* ================= DEMO ASSET LOAD ================= */

async function loadSvg(url){
  let txt=await (await fetch(url)).text();
  txt=normalizeSvgToCurrentColor(txt);
  state.items.push({svg:txt,fill:state.editableFill});
  render();
}

/* ================= INIT ================= */

document.getElementById("canvasSvg").setAttribute("viewBox","0 0 600 1000");

loadSvg("assets/hoodstufff-logo.svg");
loadSvg("assets/plz-rauten.svg");
loadSvg("assets/all-colognians-are-beautiful.svg");

</script>
</body>
</html>
